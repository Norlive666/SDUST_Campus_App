name: Build Android APK & Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Web App
        env:
          VITE_APP_VERSION: 1.0.${{ github.run_number }}
        run: pnpm run build

      - name: Test Web Proxy
        run: pnpm test:server

      - name: Package PWA Web App
        run: |
          mkdir -p web-release/server web-release/deploy
          cp -r dist web-release/
          cp server/app.mjs web-release/server/
          cp WEB-DEPLOY.md web-release/
          cp deploy/Dockerfile.web web-release/Dockerfile
          cp deploy/compose.yml deploy/Caddyfile web-release/deploy/
          cd web-release
          zip -qr "../SDUST_Campus_Web_v1.0.${{ github.run_number }}.zip" .

      - name: Upload PWA Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-pwa
          path: SDUST_Campus_Web_v1.0.${{ github.run_number }}.zip
          retention-days: 30

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Compile Android APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_VERSION: 1.0.${{ github.run_number }}
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          cp "$APK_PATH" "../SDUST_Campus_v1.0.${{ github.run_number }}.apk"

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: SDUST_Campus_v1.0.${{ github.run_number }}.apk
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: [build-android]
    runs-on: ubuntu-latest

    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets

      - name: Download PWA Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-pwa
          path: release-assets

      - name: List Release Files
        run: ls -la release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 山科小站 v1.0.${{ github.run_number }} (Android + PWA)
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*.apk
            release-assets/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
